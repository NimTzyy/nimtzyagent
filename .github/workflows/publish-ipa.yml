name: Publish IPA

# Takes the .ipa the iOS workflow produced and attaches it to a release, where
# it can be downloaded with a plain link.
#
# The build artifact itself is useless for this: fetching one needs a GitHub
# login, and an unauthenticated request gets `401 Requires authentication`.
# Release assets have no such gate. That matters because the file has to reach
# a phone and a Linux server, neither of which is going to authenticate.
#
# This runs on Linux, so unlike the build it costs nothing worth counting.

# It runs when this file changes, and that is deliberate: it publishes the
# newest *successful* iOS run, so nudging it before that run has finished would
# publish the previous build under the new version's tag. Touch this file after
# the iOS run goes green, not alongside the commit that starts it.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-ipa.yml'

permissions:
  contents: write   # create the release
  actions: read     # download the artifact from the iOS run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the newest successful iOS build
        id: fetch
        # Every command is guarded, for the same reason as in the iOS workflow:
        # `set -e` alone reports a bare "exit code 1" and hides the reason.
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The run's own commit is what the IPA was built from. It is not
          # necessarily this workflow's commit -- usually it is not, since this
          # workflow is nudged afterwards -- so the tag and the notes have to
          # name the run's, or they name a commit that never built anything.
          # Both fields in one call, so a run finishing in between cannot make
          # the id and the sha describe different builds.
          run=$(gh run list --workflow=ios.yml --status=success --limit=1 \
                  --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"') \
            || fail "Could not list iOS runs."
          [ -n "$run" ] || fail "There is no successful iOS run to publish."
          run_id="${run%% *}"
          built_sha="${run##* }"

          echo "Taking the artifact from run $run_id ($built_sha)"
          gh run download "$run_id" -n nimtzyagent-ios-unsigned-ipa -D out \
            || fail "Could not download the artifact from run $run_id."
          ls -la out

          echo "sha=$built_sha" >> "$GITHUB_OUTPUT"

      - name: Check the IPA is really there
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          ipa=$(ls out/*.ipa 2>/dev/null | head -1) || true
          [ -n "$ipa" ] || fail "The artifact contains no .ipa."
          size=$(wc -c < "$ipa")
          echo "$ipa is $size bytes"
          [ "$size" -gt 1000000 ] || fail "The IPA is only $size bytes, which is too small to be the app."

          # Kept beside the IPA so the phone can check what it downloaded.
          sha256sum "$ipa" | tee out/SHA256.txt

      - name: Publish it as a release
        env:
          # The commit the published IPA was built from, passed through the
          # environment rather than interpolated into the script.
          BUILT_SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          version=$(python3 -c "import json;print(json.load(open('app.json'))['expo']['version'])") \
            || fail "Could not read the version from app.json."
          built="${BUILT_SHA:-$GITHUB_SHA}"
          tag="ios-${version}-${built::7}"
          echo "Publishing $tag"

          # Built line by line: a multi-line quoted string inside a `run:` block
          # has to be indented to the block, and an unindented continuation
          # silently breaks the YAML. This file was invalid for exactly that
          # reason once already.
          notes="Unsigned arm64 IPA built by the iOS workflow from ${built}."
          notes="${notes}"$'\n\n'"Sign it on the device with a certificate before installing; the phone will not install it as it stands."
          notes="${notes}"$'\n\n'"The URL /releases/latest/download/NimTzyAgent-unsigned.ipa always serves the newest build."

          # Re-running this workflow must not fail on an existing tag.
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$tag" out/*.ipa out/SHA256.txt \
            --title "iOS $version (unsigned IPA)" \
            --notes "$notes" \
            || fail "gh release create failed."
